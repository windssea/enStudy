name: Check and deploy Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npm run check:functions
      - run: npm run setup:local
      - name: Verify account and learning flows on local workerd and D1
        run: npm run verify:runtime

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-release
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_AI_KEYSTORES_REQUIRED: ${{ vars.CLOUDFLARE_AI_KEYSTORES_REQUIRED }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Require deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID variable'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN secret'; exit 1; }
      - run: npm ci
      - run: npm run build
      - name: Verify resource ownership, migrate D1 and deploy Pages Functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_KEYSTORES: ${{ secrets.CLOUDFLARE_AI_KEYSTORES }}
          CLOUDFLARE_AI_HOST_ALLOWLIST: ${{ secrets.CLOUDFLARE_AI_HOST_ALLOWLIST }}
        run: npm run cf:deploy:preview -- --apply --ci
      - name: Verify deployed preview
        run: npm run verify:remote
      - name: Migrate production D1 and deploy the same build to Production
        if: vars.CLOUDFLARE_PRODUCTION_DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_AI_KEYSTORES: ${{ secrets.CLOUDFLARE_AI_KEYSTORES }}
          CLOUDFLARE_AI_HOST_ALLOWLIST: ${{ secrets.CLOUDFLARE_AI_HOST_ALLOWLIST }}
        run: npm run cf:deploy:production -- --apply --ci
      - name: Verify deployed Production
        if: vars.CLOUDFLARE_PRODUCTION_DEPLOY_ENABLED == 'true'
        run: npm run verify:production
